<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Hub — Coming Soon</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');

    :root {
      --accent: #4361ee;
      --accent2: #7c3aed;
      --bg: #080c14;
      --surface: #0f1420;
      --text: #e8ecf4;
      --muted: #6b7694;
    }

    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Background glow blobs ── */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.18;
      pointer-events: none;
      animation: float 8s ease-in-out infinite;
    }
    .blob-1 { width: 600px; height: 600px; background: var(--accent); top: -150px; left: -150px; animation-delay: 0s; }
    .blob-2 { width: 500px; height: 500px; background: var(--accent2); bottom: -100px; right: -100px; animation-delay: -4s; }
    .blob-3 { width: 300px; height: 300px; background: #06b6d4; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -2s; opacity: 0.08; }

    @keyframes float {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }

    /* ── Grid overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(67,97,238,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(67,97,238,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    /* ── Main card ── */
    .card {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 60px 48px;
      background: rgba(15, 20, 32, 0.7);
      border: 1px solid rgba(67, 97, 238, 0.2);
      border-radius: 24px;
      backdrop-filter: blur(24px);
      max-width: 580px;
      width: 90%;
      box-shadow: 0 0 80px rgba(67,97,238,0.12), 0 24px 64px rgba(0,0,0,0.4);
    }

    /* ── Logo ── */
    .logo-wrap {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
    }
    .logo-img {
      height: 44px;
      width: auto;
    }
    .logo-text {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    /* ── Gear icon ── */
    .icon-wrap {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, rgba(67,97,238,0.2), rgba(124,58,237,0.2));
      border: 1px solid rgba(67,97,238,0.3);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
    }
    .gear {
      width: 36px;
      height: 36px;
      animation: spin 6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Text ── */
    h1 {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #e8ecf4, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 36px;
      font-weight: 400;
    }

    /* ── Progress bar ── */
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .progress-label span:last-child { color: var(--accent); font-weight: 600; }
    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 36px;
    }
    .progress-fill {
      height: 100%;
      width: 72%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      position: relative;
      animation: shimmer 2s linear infinite;
      background-size: 200% 100%;
    }
    @keyframes shimmer {
      0% { background-position: 200% center; }
      100% { background-position: -200% center; }
    }

    /* ── Divider ── */
    .divider {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,0.06);
      margin-bottom: 28px;
    }

    /* ── Social links ── */
    .social-label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .socials {
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    .socials a {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      text-decoration: none;
      transition: all 0.2s;
    }
    .socials a:hover {
      background: rgba(67,97,238,0.15);
      border-color: rgba(67,97,238,0.4);
      color: var(--accent);
      transform: translateY(-2px);
    }
    .socials a svg { width: 18px; height: 18px; fill: currentColor; }

    /* ── Footer note ── */
    .footer-note {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: rgba(107,118,148,0.5);
      white-space: nowrap;
      z-index: 10;
    }

    @media (max-width: 480px) {
      .card { padding: 40px 24px; }
      h1 { font-size: 28px; }
    }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="card">

    <div class="logo-wrap">
      <img src="/assets/img/logo/logoD.png" alt="Digital Hub" class="logo-img"
           onerror="this.style.display='none'" />
      <span class="logo-text">Digital Hub</span>
    </div>

    <div class="icon-wrap">
      <svg class="gear" viewBox="0 0 24 24" fill="none" stroke="#4361ee" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </div>

    <h1>We're Building Something Great</h1>
    <p>Our platform is currently under construction. We're working hard to bring you an amazing experience. Stay tuned — we'll be live very soon.</p>

    <div class="progress-label">
      <span>Development Progress</span>
      <span>72%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>

    <div class="divider"></div>

    <p class="social-label">Follow us for updates</p>
    <div class="socials">
      <!-- LinkedIn -->
      <a href="#" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2z"/><circle cx="4" cy="4" r="2"/></svg>
      </a>
      <!-- Instagram -->
      <a href="#" aria-label="Instagram">
        <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" fill="var(--bg)"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5" stroke="var(--bg)" stroke-width="2"/></svg>
      </a>
      <!-- Facebook -->
      <a href="#" aria-label="Facebook">
        <svg viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
      </a>
      <!-- Twitter / X -->
      <a href="#" aria-label="Twitter">
        <svg viewBox="0 0 24 24"><path d="M4 4l16 16M4 20L20 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </a>
    </div>

  </div>

  <div class="footer-note">thedigitalhub.tech &nbsp;·&nbsp; &copy; 2026 Digital Hub</div>

</body>
</html>
